apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke-test
  namespace: vllm
spec:
  restartPolicy: Never
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
  containers:
    - name: nvidia-smi
      image: nvidia/cuda:12.3.2-base-ubuntu22.04
      command: ["/bin/bash", "-lc", "nvidia-smi && sleep 5"]
      resources:
        limits:
          nvidia.com/gpu: "1"
